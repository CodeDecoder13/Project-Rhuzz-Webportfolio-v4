name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: my-app/package-lock.json
      # @hookform/resolvers has optional peers that conflict under npm's strict resolver.
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      # playwright.config.ts builds and starts the app itself.
      - run: npm run e2e
        env:
          CI: "true"
      # Publish the run summary (titles, statuses, timings only) so the site can show the last verified run.
      # always(): a failing run is published too, so real failures show on the page.
      - run: node scripts/report-summary.mjs
        id: summary
        if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
      - uses: actions/upload-pages-artifact@v3
        id: pages
        if: always() && steps.summary.outcome == 'success'
        with:
          path: my-app/test-results/pages
    outputs:
      published: ${{ steps.pages.outcome == 'success' }}

  # One-time setup: repo Settings > Pages > Source "GitHub Actions". Then set TEST_REPORT_URL on the host to
  # https://<owner>.github.io/<repo>/summary.json . Without it the site shows the committed snapshot.
  publish:
    needs: check
    if: always() && needs.check.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
